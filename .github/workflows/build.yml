name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Build Web Assembly & App
        run: |
          bun install
          cd apps/web && bun add opencut-wasm || true
          cd ../..

      - name: Build Android APK
        run: |
          cd apps/mobile || cd src-tauri || true
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kneecap-app
          path: |
            **/*.apk
